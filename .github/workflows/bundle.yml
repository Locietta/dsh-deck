name: Bundle

on:
  workflow_call:
    inputs:
      version:
        description: Version label used in the bundle and artifact names
        required: true
        type: string
      retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 90
    outputs:
      artifact:
        description: Name of the uploaded bundle artifact
        value: ${{ jobs.bundle.outputs.artifact }}

jobs:
  bundle:
    name: Bundle (win-x64)
    runs-on: windows-latest
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    env:
      RUNTIME_NODE_VERSION: 26.7.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          path: dsh-src

      - uses: pnpm/action-setup@v6
        with:
          standalone: true

      # dsh's release scripts spawn bare `pnpm` without a shell, which cannot
      # execute the .cmd shims the pnpm installer puts on PATH. Standalone mode
      # ships a native pnpm.exe inside the install tree; expose its directory
      # so shell-less spawns resolve it.
      - name: Put native pnpm.exe on PATH
        run: |
          $exe = Get-ChildItem -Recurse -Filter pnpm.exe "$HOME/setup-pnpm" | Select-Object -First 1
          if (-not $exe) { throw 'pnpm.exe not found under ~/setup-pnpm' }
          $exe.DirectoryName | Out-File -Append $env:GITHUB_PATH

      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Download portable Node runtime
        run: |
          $archive = "node-v$env:RUNTIME_NODE_VERSION-win-x64"
          curl.exe --fail --silent --show-error --location --output "$archive.zip" "https://nodejs.org/dist/v$env:RUNTIME_NODE_VERSION/$archive.zip"
          Expand-Archive "$archive.zip" -DestinationPath node-dist
          "NODE_ROOT=node-dist/$archive" | Out-File -Append $env:GITHUB_ENV

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: dsh-src

      - name: Build and package bundle
        run: pnpm package -- --dsh-root dsh-src --node-root $env:NODE_ROOT

      - name: Compress bundle
        id: pack
        # Archive from inside dist/ so the bundle folder is the archive root
        # instead of being nested under dist/.
        working-directory: dist
        run: |
          $name = "dsh-deck-${{ inputs.version }}-win-x64"
          Rename-Item bundle $name
          7z a -mx=9 "../$name.7z" $name
          "artifact=$name" | Out-File -Append $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ steps.pack.outputs.artifact }}.7z
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}
